name: Terminal fast-path migration

on:
  push:
    branches:
      - agent/terminal-lifecycle-state

permissions:
  contents: write

jobs:
  migrate:
    # The workflow now exists in the parent commit; this push deliberately runs it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-lifecycle-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json
      - name: Apply fast-path changes
        run: node .github/scripts/apply-terminal-fast-path.mjs
      - name: Install dependencies
        working-directory: conduit-web
        run: npm ci
      - name: Terminal contracts
        working-directory: conduit-web
        run: node --test test/pty-output-batcher.test.js test/pty-manager.test.js test/pty-transport.test.js test/terminal-state.test.js
      - name: TypeScript
        working-directory: conduit-web
        run: npm run typecheck
      - name: Production build
        working-directory: conduit-web
        run: npm run build
      - name: Commit migration
        run: |
          rm .github/scripts/apply-terminal-fast-path.mjs .github/workflows/terminal-fast-path-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            conduit-web/src/client/remotes/terminal-renderer.ts \
            conduit-web/src/client/remotes/terminal-pane.tsx \
            conduit-web/src/pty-manager.js \
            conduit-web/src/pty-output-batcher.js \
            conduit-web/src/server/terminal-stream.js \
            conduit-web/test/pty-output-batcher.test.js \
            conduit-web/test/pty-manager.test.js \
            conduit-web/test/pty-transport.test.js \
            .github/scripts/apply-terminal-fast-path.mjs \
            .github/workflows/terminal-fast-path-build.yml
          git diff --cached --check
          git commit -m "Simplify terminal live rendering path"
          git push origin HEAD:agent/terminal-lifecycle-state

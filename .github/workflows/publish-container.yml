name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Validate release changelog
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          changelog="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$changelog" ]]; then
            echo "::error::Missing release changelog: $changelog"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$changelog"; then
            echo "::error::Release changelog is empty: $changelog"
            exit 1
          fi
          # A ceiling against a file that ran away, not a word budget. A
          # release that touched several things has several things to say.
          line_count="$(wc -l < "$changelog")"
          if (( line_count > 200 )); then
            echo "::error::Release changelog must be 200 lines or shorter: $changelog has $line_count lines"
            exit 1
          fi

  android:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build Android APK
        working-directory: conduit-web
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONDUIT_VERSION_NAME: ${{ github.ref_name }}
          CONDUIT_VERSION_CODE: ${{ github.run_number }}
          CONDUIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CONDUIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONDUIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in ANDROID_KEYSTORE_BASE64 CONDUIT_KEYSTORE_PASSWORD CONDUIT_KEY_ALIAS CONDUIT_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${value/CONDUIT_/ANDROID_}"
              exit 1
            fi
          done
          export CONDUIT_KEYSTORE_PATH="$RUNNER_TEMP/conduit-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CONDUIT_KEYSTORE_PATH"
          npm ci
          npm run cap:sync
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "conduit-${GITHUB_REF_NAME}.apk"
          sha256sum "conduit-${GITHUB_REF_NAME}.apk" > "conduit-${GITHUB_REF_NAME}.apk.sha256"
      - name: Store Android APK
        uses: actions/upload-artifact@v4
        with:
          name: conduit-android-${{ github.ref_name }}
          path: |
            conduit-web/conduit-${{ github.ref_name }}.apk
            conduit-web/conduit-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error

  windows:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: conduit-web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json
      - name: Cache Rust build
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: conduit-web/src-tauri
      - name: Take the version from the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The app, the manifest and the Release must name the same version, or
          # an installed client compares itself against a number nothing built.
          version="${RELEASE_TAG#v}"
          node -e '
            const file = "src-tauri/tauri.conf.json";
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          ' "$version"
          echo "CONDUIT_DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the desktop client
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # The same split the local build uses: the CLI bundles, and the
          # updater archive is signed afterwards by a command that can be given
          # a password rather than one that stops to ask for it.
          npx tauri build --config src-tauri/tauri.prebuilt.conf.json
      - name: Sign the updater artifact
        shell: bash
        env:
          CONDUIT_UPDATER_KEY: ${{ secrets.CONDUIT_UPDATER_KEY }}
          CONDUIT_UPDATER_KEY_PASSWORD: ${{ secrets.CONDUIT_UPDATER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CONDUIT_UPDATER_KEY:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: CONDUIT_UPDATER_KEY"
            exit 1
          fi
          bundle="src-tauri/target/release/bundle/nsis"
          installer=$(ls -1 "$bundle"/*.exe | head -1)
          archive="${installer%.exe}.nsis.zip"
          # Stored, not compressed. tauri-plugin-updater depends on the zip
          # crate with default-features off, so the only method it can read is
          # Stored; a deflated archive is refused with "Compression method not
          # supported" after the whole thing has been downloaded. The installer
          # is stored by its bare name so the updater extracts one file, not a
          # tree. 7-Zip rather than Compress-Archive, which cannot store.
          rm -f "$archive"
          (cd "$bundle" && 7z a -tzip -mm=Copy "$(basename "$archive")" "$(basename "$installer")" > /dev/null)
          # Proven here rather than on someone's machine, because the reader
          # only refuses the archive after downloading all of it.
          node scripts/check-updater-archive.mjs "$archive"
          key="$RUNNER_TEMP/conduit-updater.key"
          printf '%s' "$CONDUIT_UPDATER_KEY" > "$key"
          npx tauri signer sign \
            --private-key-path "$key" \
            --password "${CONDUIT_UPDATER_KEY_PASSWORD:-}" \
            --app-version "$CONDUIT_DESKTOP_VERSION" \
            "$archive"
          rm -f "$key"
          node scripts/desktop-update-manifest.mjs \
            "$CONDUIT_DESKTOP_VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$archive")" \
            "$archive.sig" \
            "$bundle/latest.json"
      - name: Store the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: conduit-windows-${{ github.ref_name }}
          path: |
            conduit-web/src-tauri/target/release/bundle/nsis/*.exe
            conduit-web/src-tauri/target/release/bundle/nsis/*.nsis.zip
            conduit-web/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            conduit-web/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set image metadata
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != *-rc.* ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            CONDUIT_RELEASE=${{ steps.image.outputs.release }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true

  release:
    if: github.ref_type == 'tag'
    needs:
      - android
      - container
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: conduit-android-${{ github.ref_name }}
          path: release-assets
      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: conduit-windows-${{ github.ref_name }}
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json name > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping creation"
          else
            changelog="docs/releases/${GITHUB_REF_NAME}.md"
            release_kind=(--latest)
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
              release_kind=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --notes-file "$changelog" \
              --verify-tag \
              "${release_kind[@]}"
          fi
      - name: Upload Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/conduit-*.apk release-assets/conduit-*.apk.sha256 --clobber
      - name: Upload the Windows installer and its update
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.json goes up with the artifacts it describes, in one command:
        # a Release holding a manifest whose archive is missing would tell every
        # installed client to fetch something that is not there.
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.exe \
            release-assets/*.nsis.zip \
            release-assets/*.nsis.zip.sig \
            release-assets/latest.json \
            --clobber

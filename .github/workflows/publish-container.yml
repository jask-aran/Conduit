name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate release changelog
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          changelog="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$changelog" ]]; then
            echo "::error::Missing release changelog: $changelog"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$changelog"; then
            echo "::error::Release changelog is empty: $changelog"
            exit 1
          fi
          line_count="$(wc -l < "$changelog")"
          if (( line_count > 40 )); then
            echo "::error::Release changelog must be 40 lines or shorter: $changelog has $line_count lines"
            exit 1
          fi

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != *-rc.* ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: github.ref_type == 'tag'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json

      - name: Set up Java
        if: github.ref_type == 'tag'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android APK
        if: github.ref_type == 'tag'
        working-directory: conduit-web
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONDUIT_VERSION_NAME: ${{ github.ref_name }}
          CONDUIT_VERSION_CODE: ${{ github.run_number }}
          CONDUIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CONDUIT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONDUIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in ANDROID_KEYSTORE_BASE64 CONDUIT_KEYSTORE_PASSWORD CONDUIT_KEY_ALIAS CONDUIT_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${value/CONDUIT_/ANDROID_}"
              exit 1
            fi
          done
          export CONDUIT_KEYSTORE_PATH="$RUNNER_TEMP/conduit-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CONDUIT_KEYSTORE_PATH"
          npm ci
          npm run cap:sync
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "conduit-${GITHUB_REF_NAME}.apk"
          sha256sum "conduit-${GITHUB_REF_NAME}.apk" > "conduit-${GITHUB_REF_NAME}.apk.sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            CONDUIT_RELEASE=${{ steps.image.outputs.release }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json name > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping creation"
          else
            changelog="docs/releases/${GITHUB_REF_NAME}.md"
            release_kind=(--latest)
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
              release_kind=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --notes-file "$changelog" \
              --verify-tag \
              "${release_kind[@]}"
          fi

      - name: Upload Android APK
        if: github.ref_type == 'tag'
        working-directory: conduit-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "conduit-${GITHUB_REF_NAME}.apk" "conduit-${GITHUB_REF_NAME}.apk.sha256" --clobber

name: Refresh terminal dependency lockfile

on:
  push:
    branches:
      - agent/terminal-lifecycle-state

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conduit-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-lifecycle-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- conduit-web/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conduit-web/package-lock.json
          git commit -m "Refresh terminal dependency lockfile"
          git push origin HEAD:agent/terminal-lifecycle-state

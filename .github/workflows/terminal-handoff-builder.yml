name: Terminal handoff branch builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-terminal-handoff:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/terminal-lifecycle-state'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terminal-lifecycle-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-web/package-lock.json
      - name: Apply atomic handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-terminal-handoff.mjs')
          text = p.read_text()
          start = text.index('{\n  const path = "conduit-web/test/pty-transport.test.js";')
          replacement = '''{
            const path = "conduit-web/test/pty-transport.test.js";
            let content = await read(path);
            content = replaceOnce(
              content,
              '  socket.on("message", (data, isBinary) => messages.push({ data: Buffer.from(data), isBinary }));',
              `  socket.on("message", (data, isBinary) => {
              const frame = { data: Buffer.from(data), isBinary };
              messages.push(frame);
              if (!isBinary) {
                try {
                  if (JSON.parse(frame.data.toString()).type === "replay_end") socket.send(JSON.stringify({ type: "restore_ready" }));
                } catch {}
              }
            });`,
              "test client restore acknowledgement",
            );
            await write(path, content);
          }
          '''
          p.write_text(text[:start] + replacement)
          PY
          node --check scripts/apply-terminal-handoff.mjs
          node scripts/apply-terminal-handoff.mjs
      - name: Install dependencies
        working-directory: conduit-web
        run: npm ci
      - name: Validate terminal contracts
        working-directory: conduit-web
        run: node --test test/pty-manager.test.js test/pty-transport.test.js test/terminal-state.test.js
      - name: Typecheck
        working-directory: conduit-web
        run: npm run typecheck
      - name: Build client
        working-directory: conduit-web
        run: npm run build
      - name: Commit validated handoff
        run: |
          rm -f scripts/apply-terminal-handoff.mjs .github/workflows/terminal-handoff-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make terminal restore handoff atomic"
          git push origin HEAD:agent/terminal-lifecycle-state

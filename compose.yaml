name: conduit

services:
  conduit:
    image: "${CONDUIT_IMAGE:-ghcr.io/jask-aran/conduit}:${CONDUIT_RELEASE:-latest}"
    init: true
    user: "${CONDUIT_UID:-1000}:${CONDUIT_GID:-1000}"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      CONDUIT_HOST: 0.0.0.0
      CONDUIT_PORT: 4310
      CONDUIT_DATA_ROOT: /data
      CONDUIT_CLIENT_DIST: /app/conduit-web/dist
      CONDUIT_TEMPLATES_ROOT: /app/templates
      CONDUIT_WORKSPACE_ALLOWLIST: /workspaces
      CONDUIT_WORKSPACE_SUGGESTION_ROOT: /workspaces
      ENABLE_PARTIAL_CONTINUE: "${ENABLE_PARTIAL_CONTINUE:-true}"
      CONDUIT_PARAKEET_STREAM_URL: "${CONDUIT_PARAKEET_STREAM_URL:-}"
      CONDUIT_PARAKEET_API_KEY: "${CONDUIT_PARAKEET_API_KEY:-}"
      CONDUIT_PARAKEET_STOP_MESSAGE: "${CONDUIT_PARAKEET_STOP_MESSAGE:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
    expose:
      - "4310"
    volumes:
      - type: bind
        source: "${CONDUIT_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${CONDUIT_WORKSPACES_DIR:-../workspaces}"
        target: /workspaces
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4310/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  caddy:
    image: "caddy:${CADDY_VERSION:-2-alpine}"
    restart: unless-stopped
    depends_on:
      conduit:
        condition: service_healthy
    environment:
      CONDUIT_DOMAIN: "${CONDUIT_DOMAIN:?Set CONDUIT_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

apply plugin: 'com.android.application'

android {
    namespace = "com.jaskaran.conduit"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (System.getenv("CONDUIT_KEYSTORE_PATH")) {
                storeFile file(System.getenv("CONDUIT_KEYSTORE_PATH"))
                storePassword System.getenv("CONDUIT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CONDUIT_KEY_ALIAS")
                keyPassword System.getenv("CONDUIT_KEY_PASSWORD")
            }
        }
    }
    defaultConfig {
        applicationId "com.jaskaran.conduit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("CONDUIT_VERSION_CODE") ?: "1")
        versionName System.getenv("CONDUIT_VERSION_NAME") ?: "0.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // Its own id, so a debug build (signed by another key) installs beside the released one with its own storage.
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        durable {
            initWith debug
            applicationIdSuffix ".durable"
            versionNameSuffix "-durable"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Ed25519 verification of the leaf attestation: the platform offers it
    // only on some images (ConduitWebViewClient).
    implementation "com.google.crypto.tink:tink-android:1.23.0"
    // Float's live transcription socket (ConduitFloatLive); the app already carries the Kotlin stdlib it needs.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation("org.unifiedpush.android:connector:3.3.5") {
        exclude group: "com.google.crypto.tink", module: "tink"
    }
    // Google's push service as a distributor inside the app, through Play services: no Firebase project, no other app.
    // It registers with the hub's VAPID key, so the hub sends it plain Web Push (fcm.googleapis.com).
    implementation "org.unifiedpush.android:embedded-fcm-distributor:3.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

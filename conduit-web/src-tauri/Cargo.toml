[package]
name = "conduit-desktop"
version = "0.2.0"
description = "Conduit desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "conduit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
mdns-sd = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The token is held by the OS credential store for the signed-in user: on
# Windows that is Credential Manager, which encrypts it under the user's own
# DPAPI key. Nothing Conduit ships can decrypt it for anyone else.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Only for the caption colour: the title bar is native, and stays native.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

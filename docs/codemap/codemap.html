function mapCodes(items, links) { if (!items || !items.length) return '<span class="empty">None</span>'; return '<div class="codes">' + items.map(item => links ? '<a class="code code-link" href="' + mapHref(item) + '">' + escapeMap(item) + '</a>' : '<span class="code">' + escapeMap(item) + '</span>').join("") + '</div>'; }
function mapNodeLinks(items) { if (!items || !items.length) return '<span class="empty">None</span>'; return '<div class="interaction-list">' + items.map(item => { const target = byMapId(item.node); return '<div class="interaction"><button data-map-node="' + escapeMap(item.node) + '">' + escapeMap(target ? target.label : item.node) + '</button><span class="via">' + escapeMap(item.via) + '</span></div>'; }).join("") + '</div>'; }
function mapFileRows(node) { return '<div class="files">' + node.files.map((file, index) => '<details class="file"' + (index === 0 ? ' open' : '') + '><summary><span class="file-path">' + escapeMap(file.path) + '</span><span class="file-meta">' + (file.lines || "-") + ' lines</span></summary><div class="file-body"><p class="file-role">' + escapeMap(file.responsibility) + '</p><div class="field"><h4>Exports</h4>' + mapCodes(file.exports, false) + '</div><div class="field"><h4>Imports directly</h4>' + mapCodes(file.imports, true) + '</div><div class="field"><h4>Imported by</h4>' + mapCodes(file.importedBy, true) + '</div><div class="field"><h4>Tests importing this file directly</h4>' + mapCodes(file.directTests, true) + '</div><div class="field"><h4>Open source</h4><a class="code code-link" href="' + mapHref(file.path) + '">' + escapeMap(file.path) + '</a></div></div></details>').join("") + '</div>'; }
function renderMapInspector() { const node = byMapId(selected2); if (!node) return; let body = ""; if (tab2 === "files") { body = '<section><h3>Implementation files</h3>' + mapFileRows(node) + '</section>'; } else if (tab2 === "tests") { body = '<section class="section"><h3>Related tests</h3><div class="tests">' + node.tests.map(test => '<a class="test code-link" href="' + mapHref(test) + '">' + escapeMap(test) + '</a>').join("") + '</div></section>'; } else { body = '<section class="section"><h3>Role</h3><p>' + escapeMap(node.role) + '</p></section><section class="section"><h3>Called by</h3>' + mapNodeLinks(node.callers) + '</section><section class="section"><h3>Calls and depends on</h3>' + mapNodeLinks(node.dependencies) + '</section>'; } inspector2.innerHTML = '<div class="inspector-head"><span class="kind">' + escapeMap(node.kind) + '</span><h2>' + escapeMap(node.label) + '</h2><p class="summary">' + escapeMap(node.summary) + '</p></div><div class="tabs"><button class="tab" data-map-tab="overview">Overview</button><button class="tab" data-map-tab="files">Files (' + node.files.length + ')</button><button class="tab" data-map-tab="tests">Tests (' + node.tests.length + ')</button></div><div class="body">' + body + '</div>'; inspector2.querySelectorAll("[data-map-tab]").forEach(button => { button.classList.toggle("active", button.dataset.mapTab === tab2); button.onclick = () => { tab2 = button.dataset.mapTab; renderMapInspector(); }; }); inspector2.querySelectorAll("[data-map-node]").forEach(button => { button.onclick = () => selectMapNode(button.dataset.mapNode); }); }
function renderMapNodes() { graph2.querySelectorAll(".node").forEach(node => node.remove()); MAP.nodes.forEach(node => { const button = document.createElement("button"); button.className = "node " + node.kind + (node.id === selected2 ? " selected" : ""); button.style.left = POS2[node.id][0] + "%"; button.style.top = POS2[node.id][1] + "%"; button.setAttribute("aria-label", "Inspect " + node.label); button.innerHTML = '<span class="node-kind">' + escapeMap(node.kind) + '</span><span class="node-name">' + escapeMap(node.label) + '</span><span class="node-meta">' + node.files.length + ' files · ' + node.tests.length + ' tests</span>'; button.onclick = () => selectMapNode(node.id); graph2.appendChild(button); }); }
function renderMapEdges() { const active = flow2 === "all" ? new Set() : new Set(MAP.flows.find(flow => flow.id === flow2).steps.slice(0, -1).map((id, index) => id + "|" + MAP.flows.find(flow => flow.id === flow2).steps[index + 1])); const related = new Set(MAP.edges.filter(edge => edge.from === selected2 || edge.to === selected2).map(edge => edge.from + "|" + edge.to)); edgeGroup2.innerHTML = ""; MAP.edges.forEach(edge => { const from = POS2[edge.from], to = POS2[edge.to]; if (!from || !to) return; const x1 = from[0] * 10 + 72, y1 = from[1] * 6.5 + 33, x2 = to[0] * 10 + 12, y2 = to[1] * 6.5 + 33; const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", "M " + x1 + " " + y1 + " C " + ((x1 + x2) / 2) + " " + y1 + ", " + ((x1 + x2) / 2) + " " + y2 + ", " + x2 + " " + y2); const key = edge.from + "|" + edge.to; path.setAttribute("class", "edge" + (active.has(key) ? " flow-edge" : related.has(key) ? " related" : "")); edgeGroup2.appendChild(path); }); }
function selectMapNode(id) { selected2 = id; tab2 = "files"; renderMapNodes(); renderMapEdges(); renderMapInspector(); }
function renderMapFlows() { const bar = document.getElementById("flows"); bar.innerHTML = '<span>Flows</span><button class="flow active" data-map-flow="all">All calls</button>' + MAP.flows.map(item => '<button class="flow" data-map-flow="' + item.id + '">' + escapeMap(item.label) + '</button>').join(""); bar.querySelectorAll("[data-map-flow]").forEach(button => { button.onclick = () => { flow2 = button.dataset.mapFlow; bar.querySelectorAll(".flow").forEach(item => item.classList.toggle("active", item === button)); renderMapEdges(); renderMapRoute(); }; }); }
function renderMapRoute() { const route = document.getElementById("route"); if (flow2 === "all") { route.className = "route empty"; route.textContent = "Select a flow to see its ordered path."; return; } const current = MAP.flows.find(item => item.id === flow2); route.className = "route"; route.innerHTML = current.steps.map(id => '<span class="route-step"><button class="route-chip" data-map-route-node="' + id + '">' + escapeMap(byMapId(id).label) + '</button></span>').join(""); route.querySelectorAll("[data-map-route-node]").forEach(button => { button.onclick = () => selectMapNode(button.dataset.mapRouteNode); }); }
function renderMapSearch(query) { const lower = query.toLowerCase(), hits = []; MAP.nodes.forEach(node => { if ((node.label + " " + node.summary + " " + node.role).toLowerCase().includes(lower)) hits.push({node,file:null,reason:node.summary}); node.files.forEach(file => { if ([file.path,file.responsibility,...file.exports,...file.imports,...file.importedBy].join(" ").toLowerCase().includes(lower)) hits.push({node,file,reason:file.responsibility}); }); }); inspector2.innerHTML = '<div class="inspector-head"><span class="kind">Search</span><h2>' + hits.length + ' matches</h2><p class="summary">Search covers modules, file paths, responsibilities, exports, imports, and reverse importers.</p></div><div></div><div class="body"><div class="results">' + (hits.length ? hits.slice(0, 60).map((hit, index) => '<button class="hit" data-map-hit="' + index + '"><strong>' + escapeMap(hit.node.label) + '</strong><span>' + escapeMap(hit.file ? hit.file.path : "Module overview") + '</span><p>' + escapeMap(hit.reason) + '</p></button>').join("") : '<p class="empty">No evidence matches this search.</p>') + '</div></div>'; inspector2.querySelectorAll("[data-map-hit]").forEach(button => { button.onclick = () => { const hit = hits[Number(button.dataset.mapHit)]; search2.value = ""; selectMapNode(hit.node.id); }; }); }
search2.oninput = () => search2.value.trim() ? renderMapSearch(search2.value.trim()) : renderMapInspector();
const uniqueMapFiles = new Set(MAP.nodes.flatMap(node => node.files.map(file => file.path))); document.getElementById("stats").textContent = MAP.nodes.length + " modules · " + uniqueMapFiles.size + " source files · " + MAP.flows.length + " flows"; renderMapFlows(); renderMapNodes(); renderMapEdges(); renderMapRoute(); renderMapInspector();
</script>
</body>
</html>

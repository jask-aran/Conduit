<script>
const MAP = JSON.parse(document.getElementById("codemap-data").textContent);
const EMBEDDED_LOCK = JSON.parse(document.getElementById("codemap-lock").textContent);
const graph = document.getElementById("graph");
const edgeGroup = document.getElementById("edge-group");
const inspector = document.getElementById("inspector");
const search = document.getElementById("search");
const syncPanel = document.getElementById("sync-panel");
const syncState = document.getElementById("sync-state");
const syncCheck = document.getElementById("sync-check");
const syncInput = document.getElementById("sync-input");
const byId = id => MAP.nodes.find(node => node.id === id);
const uniqueFiles = new Set(MAP.nodes.flatMap(node => node.files.map(file => file.path)));
let selected = byId("api-server") ? "api-server" : MAP.nodes[0]?.id;
let activeFlow = "all";
let activeTab = "files";
let currentLock = EMBEDDED_LOCK;
const layout = makeLayout(MAP.nodes);

function makeLayout(nodes) {
  const columns = Math.max(3, Math.ceil(Math.sqrt(nodes.length * 1.25)));
  const rows = Math.ceil(nodes.length / columns);
  const output = new Map();
  nodes.forEach((node, index) => {
    const column = index % columns;
    const row = Math.floor(index / columns);
    output.set(node.id, { x: 3 + column * (94 / Math.max(1, columns - 1)), y: 5 + row * (88 / Math.max(1, rows - 1)) });
  });
  return output;
}

function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[character])); }
function sourceHref(file) { return "../../" + file.split("/").map(encodeURIComponent).join("/"); }
function codeList(items, links) { if (!items?.length) return '<span class="empty">None</span>'; return '<div class="codes">' + items.map(item => links ? '<a class="code code-link" href="' + sourceHref(item) + '">' + escapeHtml(item) + '</a>' : '<span class="code">' + escapeHtml(item) + '</span>').join("") + '</div>'; }
function nodeLinks(items) { if (!items?.length) return '<span class="empty">None</span>'; return '<div class="interaction-list">' + items.map(item => { const target = byId(item.node); return '<div class="interaction"><button data-node="' + escapeHtml(item.node) + '">' + escapeHtml(target?.label || item.node) + '</button><span class="via">' + escapeHtml(item.via) + '</span></div>'; }).join("") + '</div>'; }
function flowPairs() { if (activeFlow === "all") return new Set(); const flow = MAP.flows.find(item => item.id === activeFlow); return new Set(flow.steps.slice(0, -1).map((id, index) => id + "|" + flow.steps[index + 1])); }
function relatedPairs() { return new Set(MAP.edges.filter(edge => edge.from === selected || edge.to === selected).map(edge => edge.from + "|" + edge.to)); }
function renderEdges() { const active = flowPairs(); const related = relatedPairs(); edgeGroup.innerHTML = ""; MAP.edges.forEach(edge => { const from = layout.get(edge.from); const to = layout.get(edge.to); if (!from || !to) return; const x1 = from.x * 10 + 72; const y1 = from.y * 6.5 + 33; const x2 = to.x * 10 + 12; const y2 = to.y * 6.5 + 33; const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); const midpoint = (x1 + x2) / 2; path.setAttribute("d", "M " + x1 + " " + y1 + " C " + midpoint + " " + y1 + ", " + midpoint + " " + y2 + ", " + x2 + " " + y2); const key = edge.from + "|" + edge.to; path.setAttribute("class", "edge" + (active.has(key) ? " flow-edge" : related.has(key) ? " related" : "")); edgeGroup.appendChild(path); }); }
function renderNodes() { graph.querySelectorAll(".node").forEach(node => node.remove()); MAP.nodes.forEach(node => { const position = layout.get(node.id); const button = document.createElement("button"); button.className = "node " + node.kind + (node.id === selected ? " selected" : ""); button.style.left = position.x + "%"; button.style.top = position.y + "%"; button.setAttribute("aria-label", "Inspect " + node.label); button.innerHTML = '<span class="node-kind">' + escapeHtml(node.kind) + '</span><span class="node-name">' + escapeHtml(node.label) + '</span><span class="node-meta">' + node.files.length + ' files · ' + node.tests.length + ' tests</span>'; button.onclick = () => selectNode(node.id); graph.appendChild(button); }); }
function fileRows(node) { return '<div class="files">' + node.files.map((file, index) => { const shortHash = file.sourceSha256 ? " · sha " + file.sourceSha256.slice(0, 10) : ""; return '<details class="file"' + (index === 0 ? ' open' : '') + '><summary><span class="file-path">' + escapeHtml(file.path) + '</span><span class="file-meta">' + (file.lines || "-") + ' lines' + shortHash + '</span></summary><div class="file-body"><p class="file-role">' + escapeHtml(file.responsibility) + '</p><div class="field"><h4>Exports</h4>' + codeList(file.exports, false) + '</div><div class="field"><h4>Imports directly</h4>' + codeList(file.imports, true) + '</div><div class="field"><h4>Imported by</h4>' + codeList(file.importedBy, true) + '</div><div class="field"><h4>Tests importing this file directly</h4>' + codeList(file.directTests, true) + '</div><div class="field"><h4>Open source</h4><a class="code code-link" href="' + sourceHref(file.path) + '">' + escapeHtml(file.path) + '</a></div></div></details>'; }).join("") + '</div>'; }
function renderInspector() { const node = byId(selected); if (!node) return; let body; if (activeTab === "files") body = '<section><h3>Implementation files</h3>' + fileRows(node) + '</section>'; else if (activeTab === "tests") body = '<section class="section"><h3>Related tests</h3><div class="tests">' + (node.tests.length ? node.tests.map(test => '<a class="test code-link" href="' + sourceHref(test) + '">' + escapeHtml(test) + '</a>').join("") : '<span class="empty">No related tests listed.</span>') + '</div></section>'; else body = '<section class="section"><h3>Role</h3><p>' + escapeHtml(node.role) + '</p></section><section class="section"><h3>Called by</h3>' + nodeLinks(node.callers) + '</section><section class="section"><h3>Calls and depends on</h3>' + nodeLinks(node.dependencies) + '</section><section class="section"><h3>Downstream impact</h3>' + nodeLinks((node.downstream || []).map(id => ({ node:id, via:"affected by changes here" }))) + '</section>'; inspector.innerHTML = '<div class="inspector-head"><span class="kind">' + escapeHtml(node.kind) + '</span><h2>' + escapeHtml(node.label) + '</h2><p class="summary">' + escapeHtml(node.summary) + '</p></div><div class="tabs"><button class="tab" data-tab="overview">Overview</button><button class="tab" data-tab="files">Files (' + node.files.length + ')</button><button class="tab" data-tab="tests">Tests (' + node.tests.length + ')</button></div><div class="body">' + body + '</div>'; inspector.querySelectorAll("[data-tab]").forEach(button => { button.classList.toggle("active", button.dataset.tab === activeTab); button.onclick = () => { activeTab = button.dataset.tab; renderInspector(); }; }); inspector.querySelectorAll("[data-node]").forEach(button => { button.onclick = () => selectNode(button.dataset.node); }); }
function selectNode(id) { selected = id; activeTab = "files"; renderNodes(); renderEdges(); renderInspector(); }
function renderFlows() { const bar = document.getElementById("flows"); bar.innerHTML = '<span>Flows</span><button class="flow active" data-flow="all">All calls</button>' + MAP.flows.map(flow => '<button class="flow" data-flow="' + escapeHtml(flow.id) + '">' + escapeHtml(flow.label) + '</button>').join(""); bar.querySelectorAll("[data-flow]").forEach(button => { button.onclick = () => { activeFlow = button.dataset.flow; bar.querySelectorAll(".flow").forEach(item => item.classList.toggle("active", item === button)); renderEdges(); renderRoute(); }; }); }
function renderRoute() { const route = document.getElementById("route"); if (activeFlow === "all") { route.className = "route empty"; route.textContent = "Select a flow to see its ordered path."; return; } const flow = MAP.flows.find(item => item.id === activeFlow); route.className = "route"; route.innerHTML = flow.steps.map(id => '<span class="route-step"><button class="route-chip" data-route-node="' + escapeHtml(id) + '">' + escapeHtml(byId(id)?.label || id) + '</button></span>').join(""); route.querySelectorAll("[data-route-node]").forEach(button => { button.onclick = () => selectNode(button.dataset.routeNode); }); }
function renderSearch(query) { const lower = query.toLowerCase(); const hits = []; MAP.nodes.forEach(node => { if ((node.label + " " + node.summary + " " + node.role).toLowerCase().includes(lower)) hits.push({ node, file:null, reason:node.summary }); node.files.forEach(file => { if ([file.path, file.responsibility, ...(file.exports || []), ...(file.imports || []), ...(file.importedBy || [])].join(" ").toLowerCase().includes(lower)) hits.push({ node, file, reason:file.responsibility }); }); }); const shown = hits.slice(0, 60); inspector.innerHTML = '<div class="inspector-head"><span class="kind">Search</span><h2>' + hits.length + ' matches</h2><p class="summary">Search covers modules, file paths, responsibilities, exports, imports, reverse importers, and source hashes.</p></div><div></div><div class="body"><div class="results">' + (shown.length ? shown.map((hit, index) => '<button class="hit" data-hit="' + index + '"><strong>' + escapeHtml(hit.node.label) + '</strong><span>' + escapeHtml(hit.file?.path || "Module overview") + '</span><p>' + escapeHtml(hit.reason) + '</p></button>').join("") : '<p class="empty">No evidence matches this search.</p>') + '</div></div>'; inspector.querySelectorAll("[data-hit]").forEach(button => { button.onclick = () => { const hit = shown[Number(button.dataset.hit)]; search.value = ""; selectNode(hit.node.id); if (hit.file) requestAnimationFrame(() => { const details = [...inspector.querySelectorAll(".file")].find(item => item.querySelector(".file-path")?.textContent === hit.file.path); if (details) { details.open = true; details.scrollIntoView({ block:"center" }); } }); }; }); }
search.oninput = () => search.value.trim() ? renderSearch(search.value.trim()) : renderInspector();

function setSync(kind, title, detail, counts) { syncPanel.className = "sync-panel " + kind; syncState.innerHTML = '<strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(detail) + '</span>' + (counts ? '<div class="sync-counts">' + counts + '</div>' : ""); }
function countChip(label, value, className) { return '<span class="sync-count ' + className + '">' + label + ' <b>' + value + '</b></span>'; }
function canonical(value) { return JSON.stringify(value); }
async function hashBytes(bytes) { if (!window.crypto?.subtle) throw new Error("Web Crypto API is not available"); const digest = await window.crypto.subtle.digest("SHA-256", bytes); return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join(""); }
async function hashText(text) { return hashBytes(new TextEncoder().encode(text)); }
function mapHashes(map) { const output = new Map(); for (const node of map.nodes || []) for (const file of node.files || []) output.set(file.path, file.sourceSha256 || ""); return output; }
function mapDifference(oldMap, newMap) { const oldHashes = mapHashes(oldMap); const newHashes = mapHashes(newMap); let changed = 0; let added = 0; let removed = 0; for (const [file, hash] of oldHashes) { if (!newHashes.has(file)) removed++; else if (hash && newHashes.get(file) && hash !== newHashes.get(file)) changed++; } for (const file of newHashes.keys()) if (!oldHashes.has(file)) added++; return { changed, added, removed, total:changed + added + removed }; }
function isInventoryPath(relativePath) { const extensions = new Set(EMBEDDED_LOCK.inventoryExtensions || []); if (relativePath === "README.md") return true; if (!(relativePath.startsWith("conduit-web/") || relativePath.startsWith("scripts/"))) return false; const inScope = relativePath === "conduit-web/README.md" || relativePath === "conduit-web/package.json" || relativePath === "conduit-web/index.html" || relativePath === "conduit-web/vite.config.js" || relativePath.startsWith("conduit-web/src/") || relativePath.startsWith("conduit-web/test/") || relativePath.startsWith("conduit-web/native/") || relativePath.startsWith("scripts/"); return inScope && (relativePath === "conduit-web/README.md" || !pathExtension(relativePath) || extensions.has(pathExtension(relativePath))); }
function pathExtension(relativePath) { const index = relativePath.lastIndexOf("."); return index < 0 ? "" : relativePath.slice(index); }
function normalizeSelectedPath(file) { const raw = file.webkitRelativePath || file.name; const parts = raw.split("/"); const start = parts.findIndex((part, index) => part === "conduit-web" || part === "scripts" || (part === "README.md" && index <= 1)); if (start < 0) return null; const relativePath = parts.slice(start).join("/"); return isInventoryPath(relativePath) ? relativePath : null; }
async function checkWorkspace(files) { const expected = currentLock.sourceManifest || EMBEDDED_LOCK.sourceManifest || {}; const selectedFiles = new Map(); for (const file of files) { const relativePath = normalizeSelectedPath(file); if (relativePath) selectedFiles.set(relativePath, file); } if (!selectedFiles.size) { setSync("warn", "Workspace not identified", "Choose the repository root so the generated paths can be matched."); return; } const paths = [...selectedFiles.keys()]; let checked = 0; const found = {}; setSync("checking", "Checking workspace", "Hashing 0 of " + paths.length + " generated files."); for (const relativePath of paths) { found[relativePath] = { sha256: await hashBytes(await selectedFiles.get(relativePath).arrayBuffer()), size: selectedFiles.get(relativePath).size }; checked++; if (checked === paths.length || checked % 20 === 0) setSync("checking", "Checking workspace", "Hashing " + checked + " of " + paths.length + " generated files."); } let changed = 0; let added = 0; let removed = 0; for (const [relativePath, expectedFile] of Object.entries(expected)) { if (!found[relativePath]) removed++; else if (found[relativePath].sha256 !== expectedFile.sha256) changed++; } for (const relativePath of Object.keys(found)) if (!expected[relativePath]) added++; const counts = countChip("Changed", changed, "changed") + countChip("Added", added, "added") + countChip("Removed", removed, "removed") + countChip("Checked", checked, ""); const total = changed + added + removed; if (total) { const changedPaths = [...new Set([...Object.keys(found).filter(file => expected[file] && expected[file].sha256 !== found[file].sha256), ...Object.keys(found).filter(file => !expected[file])])].slice(0, 4); setSync("warn", total + " file" + (total === 1 ? " differs" : "s differ") + " from snapshot", (changedPaths.length ? changedPaths.join(", ") + (total > changedPaths.length ? " …" : "") + ". " : "") + "The HTML snapshot needs regeneration.", counts); } else setSync("ok", "Workspace matches snapshot", "Checked " + checked + " generated files; no source drift found.", counts); }
async function checkSiblingData() { if (location.protocol === "file:") { setSync("neutral", "Snapshot embedded", "Direct file open cannot read sibling data. Select workspace root to check " + Object.keys(EMBEDDED_LOCK.sourceManifest || {}).length + " generated files."); return; } try { const stamp = Date.now(); const mapResponse = await fetch("codemap.json?sync=" + stamp, { cache:"no-store" }); const lockResponse = await fetch("codemap.lock?sync=" + stamp, { cache:"no-store" }); if (!mapResponse.ok || !lockResponse.ok) throw new Error("codemap.json or codemap.lock is not available"); const mapText = await mapResponse.text(); const fetchedMap = JSON.parse(mapText); const fetchedLock = JSON.parse(await lockResponse.text()); const actualHash = await hashText(canonical(fetchedMap)); if (actualHash !== fetchedLock.jsonSha256) { setSync("error", "Codemap data is inconsistent", "codemap.json does not match codemap.lock. Regenerate both files."); return; } currentLock = fetchedLock; const difference = mapDifference(MAP, fetchedMap); if (difference.total) setSync("warn", "HTML snapshot is stale", difference.changed + " mapped file" + (difference.changed === 1 ? " differs" : "s differ") + " from codemap.json. Reload this page.", countChip("Changed", difference.changed, "changed") + countChip("Added", difference.added, "added") + countChip("Removed", difference.removed, "removed")); else setSync("ok", "Map data matches", "codemap.json and codemap.lock match this HTML snapshot. Source files are not checked."); } catch (error) { setSync("warn", "Sibling data not checked", error.message + " Select workspace root to compare source hashes."); } }
syncCheck.onclick = () => syncInput.click();
syncInput.onchange = () => checkWorkspace(syncInput.files);
document.getElementById("stats").textContent = MAP.nodes.length + " modules · " + uniqueFiles.size + " mapped source files · " + MAP.flows.length + " flows";
renderFlows(); renderNodes(); renderEdges(); renderRoute(); renderInspector(); checkSiblingData();
</script>
</body>
